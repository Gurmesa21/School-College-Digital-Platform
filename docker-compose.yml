services:
  postgres:
    image: postgres:16
    container_name: school_platform_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: gurmesa_dev_db
    ports:
      - "55432:5432"
    volumes:
      - school_platform_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d gurmesa_dev_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - school_platform_net

volumes:
  school_platform_pgdata:
    name: school_platform_pgdata

networks:
  school_platform_net:
    name: school_platform_net
