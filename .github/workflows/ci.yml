name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dev_user
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: gurmesa_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      DATABASE_URL: postgresql://dev_user:dev_password@localhost:5432/gurmesa_test_db?schema=public
      AUTH_SECRET: 'dummy-secret-for-ci-tests-1234567890'
      AUTH_TRUST_HOST: 'true'
      AUTH_URL: 'http://localhost:3000'
      REDIS_URL: 'redis://localhost:6379'

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - name: Clean Dependency Installation
      run: npm ci
    - name: Validate Prisma Schema
      run: npm run prisma:validate
    - name: Generate Prisma Client
      run: npm run prisma:generate
    - name: Deploy Database Migrations
      run: npm run prisma:migrate
    - name: Seed Database
      run: npm run db:seed
    - name: Build Core Packages
      run: npm run build:shared && npm run build:db
    - name: Run Linter
      run: npm run lint
    - name: Check TypeScript Types
      run: npm run typecheck
    - name: Run Automated Tests
      run: npm run test
    - name: Build Monorepo Workspaces
      run: npm run build
    - name: Run Monorepo Smoke Verification
      run: npm run test:smoke
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run Playwright E2E Tests
      run: npx playwright test --project=chromium --max-failures=5

